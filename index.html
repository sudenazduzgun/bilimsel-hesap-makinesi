<!DOCTYPE html>
<html lang="tr">
    <head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible"content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="hesap_makinesi.css">

<link rel="icon" type="image/x-png" href="hesapmakinesi.png">
<title>Hesap Makinesi</title>
 
    </head>
<body>

    
   <div class="calculator">
<h1 class="yazı">HESAP MAKİNESİ</h1>
        <!-- Hesap makinesi ekranı -->
        <input type="text" id="ekran" disabled >

        <!-- Bilimsel tuşlar -->
        <div class="k2">


            <button class="visible"></button>
            <button class="visible"></button>
            <button class="visible"></button>
            <button class="yesil" onclick="baslat(this)">ON</button>

            <button class="kirmizi" onclick="kapat(this)" >OFF</button>
            <button onclick="isaretyazdir(this)">1/x</button>
            <button onclick="isaretyazdir(this)">%</button>
            <button onclick="isaretyazdir(this)">abs</button>
            <button onclick="isaretyazdir(this)">x²</button>
            

            <button onclick="isaretyazdir(this)">√</button>
            <button onclick="isaretyazdir(this)">-</button>
            <button onclick="isaretyazdir(this)">yˣ</button>
            <button onclick="isaretyazdir(this)">log</button>
            <button onclick="isaretyazdir(this)">ln</button>

            
            <button onclick="isaretyazdir(this)">sin</button>
            <button onclick="isaretyazdir(this)">cos</button>
            <button onclick="isaretyazdir(this)">tan</button>

            <button onclick="isaretyazdir(this)">π</button>
            <button onclick="isaretyazdir(this)">e</button>
            
            <button onclick="isaretyazdir(this)">!</button>
            

        </div>

        <!-- Sayısal tuşlar -->
        <div class="k1">

            <button  onclick="sayiyazdir(this)">7</button>
            <button onclick="sayiyazdir(this)">8</button>
            <button onclick="sayiyazdir(this)">9</button>
            <button class="kirmizi" onclick="sil(this)">DEL</button>
            <button class="kirmizi" onclick="temizle(this)">AC</button>

            <button onclick="sayiyazdir(this)">4</button>
            <button onclick="sayiyazdir(this)">5</button>
            <button onclick="sayiyazdir(this)">6</button>
            <button class="turuncu" onclick="isaretyazdir(this)">*</button>
            <button class="turuncu" onclick="isaretyazdir(this)">/</button>

            <button onclick="sayiyazdir(this)">1</button>
            <button onclick="sayiyazdir(this)">2</button>
            <button onclick="sayiyazdir(this)">3</button>
            <button class="turuncu" onclick="isaretyazdir(this);">+</button>
            <button class="turuncu" onclick="isaretyazdir(this)">−</button>

            
            <button onclick="isaretyazdir(this)">.</button>
            <button onclick="sayiyazdir(this)">0</button>
            <button onclick="sayiyazdir(this)">EXP</button>
            <button class="kirmizi" onclick="isaretyazdir(this)">Ans</button>
            <button class="yesil" onclick="sonuc(this)">=</button>

        </div>

    </div>
    <script src="hesap_makinesi.js">
       
    </script>
    
</body>

</html>
